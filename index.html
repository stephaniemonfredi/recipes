<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="recipes.css">

    <title>Document</title>

<!-- Open Graph (Facebook, LinkedIn, etc.) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Your Title">
<meta property="og:description" content="Your Description">
<meta property="og:url" content="Your URL">
<meta property="og:image" content="social-preview-image.png">

<!-- X Card -->
<meta name="twitter:card" content="Social Preview Image">
<meta name="twitter:title" content="Your Title">
<meta name="twitter:description" content="Your Description">
<meta name="twitter:image" content="social-preview-image.png">

<!-- One favicon (ICO works everywhere) -->
<link rel="icon" href="/favicon.ico">

<!-- One Apple Touch Icon (iOS home screen) -->
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                
</head>
<body>
    <header>
        <img src="images/recipe-book.png" alt="recipe image" class="recipe">
        <h1>RecipeBook</h1>
    </header>
    <form >
        <input type="search" placeholder="Find a Recipe" id="search">
        <button type="submit" class="search-button">
            <img src="images/search.svg" alt="search" class="search-icon">
        </button>
    </form>
    <hr>
    <main>
        <img src="images/apple-crisp.jpg" alt="apple crisp" id="apple-crisp">
        <div class="recipe-info">

            <button id="dessert">dessert</button>
            <h2>Apple Crisp</h2>
            <span
                class="rating"
                role="img"
                aria-label="Rating: 4 out of 5 stars"
                >
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star-empty">☆</span>
            </span>
            <p id="disc">This apple crisp is a simple yet delicious fall dessert that's great served warm with vanilla ice cream</p>
        </div>
    </main>

    <div id="end">
        <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon" class="socials"></a>
        <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon" class="socials"></a>
        <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon" class="socials"></a>
        </div>           
    
        <footer>
            <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>              
        </footer>
    </div>

</body>
</html>
